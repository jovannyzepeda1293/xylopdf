user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting: 10 requests per second with burst of 20
    # Almacenamos 10MB de IPs para tracking
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    
    # Bloqueo de Conexiones Simultáneas
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    upstream frontend_server {
        server frontend:3000;
    }

    upstream backend_server {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Seguridad básica
        server_tokens off;
        
        # Tamaño máximo de subida (importante para PDFs grandes)
        client_max_body_size 50M;

        # Aplicar Rate Limiting a toda la aplicación
        limit_req zone=mylimit burst=20 nodelay;
        limit_conn addr 10;

        # Configuración de Headers de Seguridad
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "origin-when-cross-origin";

        # Rutas del Backend (Procesamiento de PDF)
        # Se asume que el frontend llama a /api/v1/...
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Webhook de Stripe específico (Opcional: restricción por IP si conoces los rangos)
            location /api/v1/webhook-stripe {
                proxy_pass http://backend_server/webhook-stripe;
                # Aquí podrías agregar allow ... deny all si lo deseas, 
                # pero el signature check de Stripe es lo ideal.
            }
        }

        # Rutas del Frontend (Next.js)
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
